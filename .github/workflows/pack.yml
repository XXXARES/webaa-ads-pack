name: Reklam paketi

# AdMob kodunu derleyip dex + kaynak tablosunu dist/ads-pack.zip olarak depoya yazar
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['dist/**']

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Simge
        run: python3 tools/mkicon.py
      - name: Derle
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Paketle
        run: python3 tools/mkpack.py
      - name: Depoya yaz
        run: |
          git config user.name "webaa"
          git config user.email "webaa@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "Reklam paketi ${GITHUB_RUN_NUMBER}"
          git push
